<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAC 2027 - Live Results</title>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #333; }
        .header { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #004085; color: white; padding: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-logos { display: flex; gap: 15px; margin-bottom: 10px; }
        .header-logos img { height: 50px; background: white; border-radius: 5px; padding: 2px; }
        .header h1 { margin: 0; font-size: 22px; text-align: center; }
        #btn-lang { position: absolute; right: 20px; top: 20px; background: white; color: #004085; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .container { padding: 15px; max-width: 1100px; margin: 0 auto; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .btn-dash { background: white; color: #004085; border: 2px solid #004085; border-radius: 8px; padding: 10px 5px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;}
        .btn-dash:hover { background: #e9ecef; }
        .btn-dash.active { background: #004085; color: white; }
        .dash-icon { height: 26px; max-width: 100px; object-fit: contain; }

        .filter-bar { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .filter-bar select { padding: 10px; font-size: 16px; border: 1px solid #ced4da; border-radius: 5px; min-width: 150px; font-weight: bold; }
        .status-badge { display: inline-block; background: #198754; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .status-syncing { background: #ffc107; color: black; }

        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: #002752; color: white; padding: 12px; text-align: center; text-transform: uppercase; font-size: 12px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #e9ecef; vertical-align: middle; font-size: 14px; text-align: center; }
        tr:nth-child(even) td { background-color: #f8f9fa; }
        
        .badge-rank { background-color: #0dcaf0; color: #000; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; border: 2px solid #0056b3; }
        .badge-ord { background-color: #004085; color: white; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font-size: 13px; }
        .out-rank { background-color: #e9ecef; color: #6c757d; border-color: transparent;}
        
        .score-big { font-size: 16px; font-weight: bold; color: #004085; }
        .text-left { text-align: left !important; }
        .row-out { color: #dc3545; background-color: #f8d7da !important; }
        .row-out .score-big { color: #dc3545; }

        #welcome-msg { text-align: center; padding: 50px 20px; color: #6c757d; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <button id="btn-lang" onclick="toggleLanguage()">🇬🇧 Switch to English</button>
        <div class="header-logos">
            <img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" crossorigin="anonymous">
            <img src="https://lh3.googleusercontent.com/d/1h0cOsNsO7nV9CA4o2vc1MQSvvlCov0px" crossorigin="anonymous">
        </div>
        <h1 id="main-title">WAC 2027 Live Results</h1>
    </div>

    <div class="container">
        <div class="dashboard">
            <button class="btn-dash" onclick="apriGara('Agility', this)"><img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" class="dash-icon" crossorigin="anonymous"> Agility</button>
            <button class="btn-dash" onclick="apriGara('Jumping', this)"><img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" class="dash-icon" crossorigin="anonymous"> Jumping</button>
            <button class="btn-dash" onclick="apriGara('Snooker', this)"><img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" class="dash-icon" crossorigin="anonymous"> Snooker</button>
            <button class="btn-dash" onclick="apriGara('Gambler', this)"><img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" class="dash-icon" crossorigin="anonymous"> Gambler</button>
            <button class="btn-dash" style="border-color:#198754; color:#198754;" onclick="apriGara('Biathlon B1', this)"><img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" class="dash-icon" crossorigin="anonymous"> Biathlon B1</button>
            <button class="btn-dash" style="border-color:#198754; color:#198754;" onclick="apriGara('Biathlon B2', this)"><img src="https://lh3.googleusercontent.com/d/1xSYvZbiAhhpNat57RXdc0nE11ocZKXry" class="dash-icon" crossorigin="anonymous"> Biathlon B2</button>
        </div>

        <div class="filter-bar" id="barra-filtri">
            <label id="lbl-height" style="color:#004085; font-weight:bold; margin-right:10px;">Height (Jump-Up):</label>
            <select id="altezza-live" onchange="disegnaClassificaLive()">
                <option value="250">250</option>
                <option value="300">300</option>
                <option value="400">400</option>
                <option value="500">500</option>
                <option value="600">600</option>
            </select>
            <br>
            <div id="badge-sync" class="status-badge status-syncing">↻ Aggiornamento in corso...</div>
        </div>

        <div id="welcome-msg" class="lang-txt" data-key="welcome">Seleziona una gara dal menu in alto per visualizzare la classifica in tempo reale.</div>
        
        <div class="table-container" id="area-tabella" style="display:none;">
            <table>
                <thead id="live-head"></thead>
                <tbody id="live-body"></tbody>
            </table>
        </div>
    </div>

<script>
    // --- GESTIONE LINGUE ---
    let lang = 'it';
    const dict = {
        'it': { title: 'WAC 2027 Live Results', height: 'Altezza (Jump-Up):', sync: '↻ Ricerca nuovi tempi...', conn: '🟢 Connesso al server gara. Seleziona una competizione in alto.', live: '🟢 Risultati Live (Auto-Sync)', err: '🔴 Errore di connessione. Riprovo...', welcome: 'Seleziona una gara dal menu in alto per visualizzare la classifica in tempo reale.', no_ath: 'Nessun atleta in questa altezza.', ord: 'ORD.', pett: 'PETT.', bin: 'BINOMIO', time: 'TEMPO', errs: 'ERRORI', ref: 'RIFIUTI', ea: 'E / A', pen: 'PEN. TOTALI', rank: 'RANK' },
        'en': { title: 'WAC 2027 Live Results', height: 'Height (Jump-Up):', sync: '↻ Syncing...', conn: '🟢 Connected to server. Select a competition.', live: '🟢 Live Results (Auto-Sync)', err: '🔴 Connection error. Retrying...', welcome: 'Select a competition from the top menu to view live standings.', no_ath: 'No athletes in this height.', ord: 'ORD.', pett: 'BIB', bin: 'HANDLER & DOG', time: 'TIME', errs: 'FAULTS', ref: 'REFUSALS', ea: 'E / A', pen: 'TOTAL PEN.', rank: 'RANK' }
    };

    function toggleLanguage() {
        lang = lang === 'it' ? 'en' : 'it';
        document.getElementById('btn-lang').innerText = lang === 'it' ? "🇬🇧 Switch to English" : "🇮🇹 Passa all'Italiano";
        document.getElementById('main-title').innerText = dict[lang].title;
        document.getElementById('lbl-height').innerText = dict[lang].height;
        
        let msg = document.getElementById('welcome-msg');
        if(msg.innerText.includes("Connesso") || msg.innerText.includes("Connected")) msg.innerText = dict[lang].conn;
        else msg.innerText = dict[lang].welcome;
        
        let badge = document.getElementById('badge-sync');
        if(badge.innerText.includes("Live")) badge.innerText = dict[lang].live;

        if(garaAttiva !== "") disegnaClassificaLive();
    }

    const MIO_LINK_SCRIPT = "https://script.google.com/macros/s/AKfycbw6qAxK-JyVMM5pnHLGOQQCbk_mfa9CPo3hft-1vOe8AFxEGPVGRh7d-YmRzpKirANd/exec";
    const SCRIPT_URL = MIO_LINK_SCRIPT + "?azione=ottieni_dati_live";

    let iscrittiLive = []; let risultatiLive = {}; let garaAttiva = ""; let pollingInterval = null;
    function getSigla(n) { return n ? `[${n.substring(0,3).toUpperCase()}]` : ""; }

    function scaricaDatiServer(isPrimoAvvio) {
        if(!isPrimoAvvio) {
            document.getElementById('badge-sync').className = "status-badge status-syncing";
            document.getElementById('badge-sync').innerText = dict[lang].sync;
        }
        let script = document.createElement('script');
        script.src = SCRIPT_URL + "&callback=gestisciDatiJsonp&t=" + new Date().getTime();
        script.onerror = function() {
            document.getElementById('badge-sync').className = "status-badge status-syncing";
            document.getElementById('badge-sync').innerText = dict[lang].err;
        };
        document.body.appendChild(script);
        script.onload = function() { document.body.removeChild(script); };
    }

    function gestisciDatiJsonp(data) {
        if (data.errore) return;
        iscrittiLive = data.iscritti || []; risultatiLive = data.risultati || {};
        
        let msgBenvenuto = document.getElementById('welcome-msg');
        if (msgBenvenuto && msgBenvenuto.style.display !== 'none') msgBenvenuto.innerText = dict[lang].conn;
        if (garaAttiva !== "") disegnaClassificaLive(); 
        
        document.getElementById('badge-sync').className = "status-badge";
        document.getElementById('badge-sync').innerText = dict[lang].live;
    }

    window.onload = function() {
        scaricaDatiServer(true);
        pollingInterval = setInterval(function() { scaricaDatiServer(false); }, 15000);
    };

    function apriGara(nomeGara, btn) {
        document.querySelectorAll('.btn-dash').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
        garaAttiva = nomeGara;
        document.getElementById('welcome-msg').style.display = 'none';
        document.getElementById('barra-filtri').style.display = 'block';
        document.getElementById('area-tabella').style.display = 'block';
        disegnaClassificaLive();
    }

    function disegnaClassificaLive() {
        let head = document.getElementById('live-head');
        let body = document.getElementById('live-body');
        
        // Intestazione con 9 colonne esatte[cite: 4]
        head.innerHTML = `<tr>
            <th width="40">${dict[lang].ord}</th>
            <th width="50">${dict[lang].pett}</th>
            <th class="text-left">${dict[lang].bin}</th>
            <th width="70">${dict[lang].time}</th>
            <th width="70">${dict[lang].errs}</th>
            <th width="70">${dict[lang].ref}</th>
            <th width="50">${dict[lang].ea}</th>
            <th width="90">${dict[lang].pen}</th>
            <th width="50">${dict[lang].rank}</th>
        </tr>`;
        
        body.innerHTML = "";
        if(!garaAttiva) return;
        if(!risultatiLive[garaAttiva]) risultatiLive[garaAttiva] = {};

        let alt = document.getElementById('altezza-live').value;
        let atleti = iscrittiLive.filter(b => b.cat === alt);

        if(atleti.length === 0) {
            return body.innerHTML = `<tr><td colspan="9" align="center" style="padding:30px; font-style:italic;">${dict[lang].no_ath}</td></tr>`;
        }

        let calcolati = atleti.map(c => {
            let d = risultatiLive[garaAttiva][c.pett] || {tempo:"", esito:""};
            let floatT = parseFloat((d.tempo||"0").toString().replace(',','.')) || 0; 
            let hasT = (floatT > 0); 
            let isOut = ['E','A','DIS','ABS'].includes(d.esito);
            let scoreF = 0; let testoS = "-"; let eaVal = "";

            if (isOut) { 
                eaVal = d.esito; 
                testoS = d.esito; 
            } else if (hasT) { 
                scoreF = floatT + ((parseInt(d.err)||0)*5) + ((parseInt(d.rif)||0)*5); 
                testoS = scoreF.toFixed(3).replace('.', ','); 
            }
            
            // Estrazione ordine di partenza
            let ord = (c.ordini && c.ordini[garaAttiva]) ? parseInt(c.ordini[garaAttiva]) : 999;
            
            return { c: c, pett: c.pett, d: d, hasT: hasT, isOut: isOut, scoreF: scoreF, testoS: testoS, eaVal: eaVal, ord: ord };
        });

        // Creazione array ordinato per i RANK
        let ordinati = [...calcolati].sort((a,b) => { 
            if(a.isOut && !b.isOut) return 1; if(!a.isOut && b.isOut) return -1; if(!a.hasT && b.hasT) return 1; if(a.hasT && !b.hasT) return -1; if(!a.hasT && !b.hasT) return 0; 
            return a.scoreF - b.scoreF; 
        });

        // ORDINAMENTO FINALE PER LA VISUALIZZAZIONE (Per Ordine di partenza come da screenshot)[cite: 4]
        calcolati.sort((a,b) => a.ord - b.ord);

        calcolati.forEach((item) => {
            let rowClass = item.isOut ? "row-out" : "";
            
            // Calcolo RANK
            let rankHtml = `<span class="badge-rank out-rank">-</span>`;
            if(item.hasT && !item.isOut) {
                let r = ordinati.findIndex(x => x.pett === item.pett) + 1;
                rankHtml = `<span class="badge-rank">${r}</span>`;
            }

            let nomeHtml = `<b>${item.c.conduttore} - ${item.c.cane}</b><br><small style="color:#6c757d;">${getSigla(item.c.nazione)} ${item.c.nazione}</small>`;
            
            // Gestione dei valori da mostrare[cite: 4]
            let showTime = (item.hasT && !item.isOut) ? item.d.tempo : "";
            let showErr = (item.hasT && !item.isOut) ? (item.d.err || "") : "";
            let showRif = (item.hasT && !item.isOut) ? (item.d.rif || "") : "";
            let showOrd = item.ord !== 999 ? item.ord : "-";

            let h = `<tr class="${rowClass}">
                <td><span class="badge-ord">${showOrd}</span></td>
                <td><b>${item.pett}</b></td>
                <td class="text-left">${nomeHtml}</td>
                <td><b>${showTime}</b></td>
                <td>${showErr}</td>
                <td>${showRif}</td>
                <td style="font-weight:bold;">${item.eaVal}</td>
                <td class="score-big">${item.testoS}</td>
                <td>${rankHtml}</td>
            </tr>`;
            
            body.innerHTML += h;
        });
    }
</script>
</body>
</html>
